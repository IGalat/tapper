name: Tests

on:
  - push
  - pull_request

jobs:
  check:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "upper"]
        include:
          # 3.12 is the default mise.toml; "upper" comes from mise.upper.toml: same tasks on the
          # newest Python minor minus one (sub-0.1:latest), old enough that all deps have wheels.
          - python: "3.12"
            mise_env: ""
          - python: "upper"
            mise_env: "upper"
    env:
      MISE_ENV: ${{ matrix.mise_env }}

    steps:
      - uses: actions/checkout@v5

      # Installs python + uv from mise.toml (+ mise.$MISE_ENV.toml) and puts them on PATH.
      - uses: jdx/mise-action@v5

      - name: Install project
        run: mise run install

      - name: Tests, lint, typecheck
        run: mise run check

      - name: Build package
        run: mise run build
