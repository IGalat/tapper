# Git hooks via the pre-commit framework.
#   pre-commit itself is installed by mise ([tools] in mise.toml).
#   ruff and pyright are the project's own versions from uv.lock, called through `uv run`
#   (language: system), so hooks, `mise run check` and CI all agree.
#
#   mise run install               installs the git hook (pre-commit install) along with the venv
#   pre-commit run --all-files     run every hook on the whole repo
#   pre-commit autoupdate          bump the revs of the remote repos below

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint + auto-fix)
        entry: mise exec -- uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: mise exec -- uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: pyright
        name: pyright
        entry: mise exec -- uv run pyright
        language: system
        files: ^src/.*\.py$
        require_serial: true
        stages: [manual]  # remove when pyright errors are fixed

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=10000']
