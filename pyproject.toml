[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"


[project]
name = "tapper"
version = "2024.9.4"  # YYYY.M.MICRO
description = "Modern Hotkey and Macro Tool"
authors = [{ name = "IGalat", email = "author_email@example.com" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Monitoring",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Typing :: Typed",
]


dependencies = [
    "winput>=1.5.0; sys_platform == 'win32'",
    "pywin32>=305; sys_platform == 'win32'",
    "evdev>=1.6.0; sys_platform == 'linux'",
]


[project.optional-dependencies]
# For users: `pip install tapper[all]`. Contributors get all of them via the dev group below.
all = ["tapper[tray,img]"]
# System tray icon
tray = [
    "pillow>=9.4.0",
    "pystray>=0.19.4",
]
# Image matching
img = [
    "pillow>=9.4.0",
    "mss>=10.2.0",  # mss.MSS top-level export
    "numpy>=1.24.1",
    "opencv-python>=4.7.0.68",
]


[dependency-groups]
dev = [
    "tapper[all]",
    "pytest>=7.1",
    "pytest-cov>=3",
    "hypothesis>=6.54.6",
    "ruff>=0.14",
    "pyright>=1.1.400",
]

[project.urls]
"Homepage" = "https://github.com/IGalat/tapper"

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
# src/tapper is the module root; py.typed and resources/ inside it ship automatically.
module-name = "tapper"


[tool.pytest.ini_options]
addopts = "--cov=tapper"
pythonpath = [
    "src",
]
testpaths = [
    "tests",
]
tmp_path_retention_count = 0

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
# - `ruff check --fix` applies safe fixes only; UP/SIM/C4/RUF leave "unsafe" ones behind,
#   apply them with `--unsafe-fixes` and read that diff.
# - A rule is wrong for one line: `# noqa: CODE  # why`. RUF100 flags the noqa once it stops being needed.
select = [
    "E",    # pycodestyle errors the formatter doesn't already enforce
    "W",    # pycodestyle warnings (stray whitespace, deprecated syntax)
    "F",    # pyflakes: undefined/unused names, unused imports, broken f-strings
    "I",    # import order; force-single-line below keeps the old reorder-python-imports style
    "T10",  # leftover breakpoint()/pdb calls
    "UP",   # pyupgrade to the 3.12 baseline: X | None, `type` aliases, PEP 695 generics; some fixes unsafe
    "SIM",  # simplifications: collapsible ifs, needless bool, yoda comparisons; fixes are unsafe
    "C4",   # comprehension/literal rewrites: dict(), list(x for ...), needless comprehensions
    "PIE",  # misc: unnecessary pass, duplicate class fields, needless range starts
    "ISC",  # implicit string concatenation across lines, usually a missing comma in a list
    "TID",  # banned and relative imports
    "DTZ",  # naive datetimes; nothing uses datetime today, this guards the future
    "B",    # bugbear: raise-from in except, cache on methods, mutable/call defaults, zip strict=
    "RUF",  # ruff's own: unused noqa, unpacked-but-unused vars, mutable class attrs; RUF001-003 off for languages.py
    "BLE",  # no blind `except Exception`; around user callbacks keep it with `# noqa: BLE001  # why`
    "N",    # pep8 naming; a hit is usually an API rename, so it is a decision, not a fix
    "PTH",  # pathlib over os.path; Path() rejects bytes paths, os.fsdecode() first
    "T20",  # no print statements (tests/manual excluded, see below)
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"src/tapper/model/languages.py" = ["RUF001", "RUF002", "RUF003"]  # charsets contain lookalike glyphs on purpose
"tests/**" = [
    "BLE001",  # harnesses catch everything to report it
]
"tests/manual/**" = [
    "T20",  # printing is how the manual scripts report
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "double"


[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src"]
typeCheckingMode = "standard"
reportMissingImports = "none"  # optional OS/extra deps (winput, pywin32, evdev, cv2...)
reportMissingModuleSource = "none"
reportMissingTypeArgument = "error"
reportMissingParameterType = "error"
